<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Classic Facebook</title>
  <style>
    :root {
      --blue: #4267b2;
      --text: #1d2129;
      --text-2: #606770;
      --border: #dddfe2;
      --wash: #e9ebee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 260px;
      font: 12px/1.34 Helvetica, Arial, sans-serif;
      color: var(--text);
      background: var(--wash);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: var(--blue);
      color: #fff;
      font-weight: bold;
      font-size: 13px;
    }
    header label { display: flex; align-items: center; gap: 6px; font-weight: normal; font-size: 12px; cursor: pointer; }
    .box {
      margin: 8px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 3px;
    }
    .box h2 {
      margin: 0;
      padding: 6px 10px;
      font-size: 12px;
      color: var(--text-2);
      background: #f6f7f9;
      border-bottom: 1px solid var(--border);
    }
    .option {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      padding: 7px 10px;
      cursor: pointer;
    }
    .option + .option { border-top: 1px solid #e9ebee; }
    .option input { margin: 1px 0 0; }
    .option strong { display: block; font-size: 12px; }
    .option span { color: var(--text-2); font-size: 11px; }
    fieldset { border: 0; margin: 0; padding: 0; }
    fieldset:disabled { opacity: 0.5; }
    footer { padding: 0 10px 8px; color: var(--text-2); font-size: 11px; }
  </style>
</head>
<body>
  <header>
    Classic Facebook
    <label><input type="checkbox" id="enabled"> On</label>
  </header>

  <fieldset id="features" class="box">
    <h2>Pieces of the old look</h2>
    <label class="option">
      <input type="checkbox" data-key="colors">
      <div><strong>Classic colors</strong><span>Old blue, grey page, blue links</span></div>
    </label>
    <label class="option">
      <input type="checkbox" data-key="header">
      <div><strong>Blue top bar</strong><span>Slim 2020 bar: wide search, your name, Home, Create</span></div>
    </label>
    <label class="option">
      <input type="checkbox" data-key="layout">
      <div><strong>2020 page layout</strong><span>Centered page, slim left nav, boxed right column</span></div>
    </label>
    <label class="option">
      <input type="checkbox" data-key="feed">
      <div><strong>Classic News Feed</strong><span>Create Post box, Stories box, boxed posts, Like · Comment · Share</span></div>
    </label>
    <label class="option">
      <input type="checkbox" data-key="square">
      <div><strong>Square corners</strong><span>Drops the big rounded cards</span></div>
    </label>
    <label class="option">
      <input type="checkbox" data-key="compact">
      <div><strong>Compact desktop density</strong><span>Smaller text, slimmer bar, tighter lists</span></div>
    </label>
  </fieldset>

  <footer>Changes apply instantly. Colors apply in light mode only.</footer>

  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
